[theme]
base = "light"
primaryColor = "#FEF08A"
backgroundColor = "#FAF8F5"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1A1A1A"
font = "sans serif"
baseRadius = "16px"
buttonRadius = "10px"
borderColor = "#DDD8CE"
dataframeBorderColor = "#DDD8CE"
dataframeHeaderBackgroundColor = "#FFEDD5"
showWidgetBorder = true
showSidebarBorder = true
chartCategoricalColors = ["#1A1A1A", "#FEF08A", "#FFEDD5", "#FED7AA", "#FB923C"]

[theme.sidebar]
backgroundColor = "#FAF8F5"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1A1A1A"
primaryColor = "#FEF08A"
baseRadius = "10px"
buttonRadius = "8px"
borderColor = "#DDD8CE"
showWidgetBorder = true

[server]
runOnSave = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = true
